<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="カード管理">
  <title>カード利用管理</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    body { 
      -webkit-tap-highlight-color: transparent; 
      background-color: #f8fafc;
    }
    .dark body {
      background-color: #0f172a;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- PWA Setup -->
  <script>
    const manifest = {
      "name": "カード管理",
      "short_name": "カード管理",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#f8fafc",
      "theme_color": "#2563eb",
      "icons": [
        {
          "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Cpath d='M20 40h60v35H20z' fill='white' opacity='0.3'/%3E%3Cpath d='M20 25h60v10H20z' fill='white'/%3E%3C/svg%3E",
          "sizes": "192x192",
          "type": "image/svg+xml"
        }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    document.write(`<link rel="manifest" href="${manifestURL}">`);

    const swCode = `
      self.addEventListener('install', (e) => self.skipWaiting());
      self.addEventListener('activate', (e) => self.clients.claim());
      self.addEventListener('fetch', (e) => {});
    `;
    const swBlob = new Blob([swCode], {type: 'application/javascript'});
    const swUrl = URL.createObjectURL(swBlob);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Utility Functions ---
    const formatCurrency = (amount) => {
      return new Intl.NumberFormat('ja-JP').format(amount || 0);
    };

    const getMonthKey = (dateString) => {
      const d = new Date(dateString);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    };

    const formatMonth = (monthKey) => {
      const [year, month] = monthKey.split('-');
      return `${year}年${parseInt(month)}月`;
    };

    const generateId = () => Math.random().toString(36).substr(2, 9) + Date.now().toString(36);

    const todayString = () => {
      const d = new Date();
      const tzOffset = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - tzOffset).toISOString().split('T')[0];
    };

    const getFirstDayOfMonth = () => {
      const d = new Date();
      const tzOffset = d.getTimezoneOffset() * 60000;
      return new Date(new Date(d.getFullYear(), d.getMonth(), 1).getTime() - tzOffset).toISOString().split('T')[0];
    };

    const getLastDayOfMonth = () => {
      const d = new Date();
      const tzOffset = d.getTimezoneOffset() * 60000;
      return new Date(new Date(d.getFullYear(), d.getMonth() + 1, 0).getTime() - tzOffset).toISOString().split('T')[0];
    };

    // --- Initial Data ---
    const DEFAULT_CATEGORIES = [
      { id: 'c1', name: '食費', color: '#ef4444' },
      { id: 'c15', name: '立替費', color: '#f59e0b' },
      { id: 'c6', name: 'ガソリン', color: '#10b981' },
      { id: 'c17', name: 'コンビニ', color: '#f97316' },
      { id: 'c18', name: '自販機', color: '#3b82f6' },
      { id: 'c16', name: 'PASMO', color: '#14b8a6' },
      { id: 'c19', name: 'NET SHOP', color: '#8b5cf6' },
      { id: 'c14', name: 'その他', color: '#64748b' },
    ];

    const DEFAULT_CARDS = [
      { id: 'card1', name: 'メインカード' },
    ];

    const DEFAULT_SETTINGS = {
      budget: 100000,
      enableNotification: true,
      notificationUnit: 10000,
      darkMode: false,
    };

    // --- Components ---

    const Toast = ({ message, onClose }) => {
      useEffect(() => {
        const timer = setTimeout(onClose, 4000);
        return () => clearTimeout(timer);
      }, [onClose]);

      return (
        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 animate-fade-in-down w-[90%] max-w-sm">
          <div className="bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3">
            <i className="ph-fill ph-bell text-xl text-yellow-400"></i>
            <span className="font-medium text-sm flex-1">{message}</span>
            <button onClick={onClose} className="p-1"><i className="ph ph-x text-base"></i></button>
          </div>
        </div>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [transactions, setTransactions] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [cards, setCards] = useState(DEFAULT_CARDS);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [notifiedLevels, setNotifiedLevels] = useState({});
      const [notificationHistory, setNotificationHistory] = useState([]);
      
      const [isLoaded, setIsLoaded] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);
      
      const [editingTransaction, setEditingTransaction] = useState(null);
      const [quickAddData, setQuickAddData] = useState(null);

      // Load Data
      useEffect(() => {
        const load = (key, setter, fallback) => {
          const stored = localStorage.getItem(`cardApp_${key}`);
          if (stored) {
            try { setter(JSON.parse(stored)); } catch (e) { setter(fallback); }
          } else { setter(fallback); }
        };

        load('transactions', setTransactions, []);
        load('categories', setCategories, DEFAULT_CATEGORIES);
        load('cards', setCards, DEFAULT_CARDS);
        load('settings', setSettings, DEFAULT_SETTINGS);
        load('notifiedLevels', setNotifiedLevels, {});
        load('notificationHistory', setNotificationHistory, []);
        setIsLoaded(true);
      }, []);

      // Save Data
      useEffect(() => {
        if (!isLoaded) return;
        localStorage.setItem('cardApp_transactions', JSON.stringify(transactions));
        localStorage.setItem('cardApp_categories', JSON.stringify(categories));
        localStorage.setItem('cardApp_cards', JSON.stringify(cards));
        localStorage.setItem('cardApp_settings', JSON.stringify(settings));
        localStorage.setItem('cardApp_notifiedLevels', JSON.stringify(notifiedLevels));
        localStorage.setItem('cardApp_notificationHistory', JSON.stringify(notificationHistory));

        if (settings.darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [transactions, categories, cards, settings, notifiedLevels, notificationHistory, isLoaded]);

      useEffect(() => {
        if (settings.enableNotification && "Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
      }, [settings.enableNotification]);

      const currentMonthKey = getMonthKey(todayString());
      
      const currentMonthTransactions = useMemo(() => {
        return transactions.filter(t => getMonthKey(t.date) === currentMonthKey);
      }, [transactions, currentMonthKey]);

      const currentMonthTotal = useMemo(() => {
        return currentMonthTransactions.reduce((sum, t) => sum + Number(t.amount), 0);
      }, [currentMonthTransactions]);

      const isInitialMount = useRef(true);
      
      useEffect(() => {
        if (!isLoaded) return;
        if (isInitialMount.current) {
          isInitialMount.current = false;
          return;
        }

        if (!settings.enableNotification || !settings.notificationUnit) return;
        
        const unit = Number(settings.notificationUnit);
        if (unit <= 0) return;

        const currentLevel = Math.floor(currentMonthTotal / unit) * unit;
        const lastNotifiedLevel = notifiedLevels[currentMonthKey] || 0;

        if (currentLevel > lastNotifiedLevel && currentLevel > 0) {
          const msg = `今月の利用額が${formatCurrency(currentLevel)}円を突破しました！`;
          setToastMessage(msg);
          
          const newHistory = [{
            id: generateId(),
            date: new Date().toISOString(),
            message: msg
          }, ...notificationHistory].slice(0, 50);

          setNotificationHistory(newHistory);
          setNotifiedLevels(prev => ({ ...prev, [currentMonthKey]: currentLevel }));

          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("カード利用お知らせ", { body: msg });
          }
        }
      }, [currentMonthTotal, isLoaded, settings.enableNotification, settings.notificationUnit, currentMonthKey]);

      const saveTransaction = (data) => {
        if (editingTransaction) {
          setTransactions(transactions.map(t => t.id === editingTransaction.id ? { ...data, id: editingTransaction.id } : t));
        } else {
          setTransactions([{ ...data, id: generateId() }, ...transactions].sort((a, b) => new Date(b.date) - new Date(a.date)));
        }
        setEditingTransaction(null);
        setQuickAddData(null);
        setActiveTab('home');
      };

      const deleteTransaction = (id) => {
        if (window.confirm('この記録を削除しますか？')) {
          setTransactions(transactions.filter(t => t.id !== id));
          setActiveTab('list');
        }
      };

      const handleQuickAdd = (categoryId, store = '', startWithFreeWord = false) => {
        setQuickAddData({ categoryId, store, startWithFreeWord });
        setActiveTab('add');
      };

      const handleEdit = (transaction) => {
        setEditingTransaction(transaction);
        setActiveTab('add');
      };

      const handleAddCategory = (newCategory) => {
        setCategories(prev => [...prev, newCategory]);
      };

      if (!isLoaded) return <div className="min-h-screen flex items-center justify-center dark:bg-slate-900"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div></div>;

      return (
        <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans pb-20 selection:bg-blue-200 dark:selection:bg-blue-900 relative">
          {toastMessage && <Toast message={toastMessage} onClose={() => setToastMessage(null)} />}

          <div className="max-w-md mx-auto w-full h-full min-h-screen relative shadow-2xl bg-slate-50 dark:bg-slate-900 overflow-x-hidden">
            
            <div className="animate-fade-in">
              {activeTab === 'home' && (
                 <HomeScreen 
                   total={currentMonthTotal} 
                   transactions={currentMonthTransactions} 
                   settings={settings}
                   categories={categories}
                   onQuickAdd={handleQuickAdd}
                   onEdit={handleEdit}
                   currentMonthKey={currentMonthKey}
                   allTransactions={transactions}
                 />
              )}
              {activeTab === 'list' && (
                 <ListScreen 
                   transactions={transactions} 
                   categories={categories}
                   cards={cards}
                   onEdit={handleEdit}
                 />
              )}
              {activeTab === 'add' && (
                 <AddScreen 
                   onSave={saveTransaction}
                   onCancel={() => { setEditingTransaction(null); setQuickAddData(null); setActiveTab('home'); }}
                   categories={categories}
                   cards={cards}
                   initialData={editingTransaction || quickAddData}
                   onDelete={editingTransaction ? () => deleteTransaction(editingTransaction.id) : null}
                   onAddCategory={handleAddCategory}
                 />
              )}
              {activeTab === 'stats' && (
                 <StatsScreen 
                   transactions={transactions}
                   categories={categories}
                   cards={cards}
                 />
              )}
              {activeTab === 'settings' && (
                 <SettingsScreen 
                   settings={settings}
                   setSettings={setSettings}
                   notificationHistory={notificationHistory}
                   transactions={transactions}
                   setTransactions={setTransactions}
                   categories={categories}
                   setCategories={setCategories}
                   cards={cards}
                   setCards={setCards}
                   onShowToast={(msg) => setToastMessage(msg)}
                 />
              )}
            </div>

            <nav className="fixed bottom-0 w-full max-w-md bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 z-40 pb-safe">
              <div className="flex justify-evenly items-center h-[72px] px-2 gap-1">
                <NavItem iconClass="ph ph-house" label="ホーム" isActive={activeTab === 'home'} onClick={() => setActiveTab('home')} />
                <NavItem iconClass="ph ph-list" label="明細" isActive={activeTab === 'list'} onClick={() => setActiveTab('list')} />
                
                <div className="relative -top-6 shrink-0 px-2">
                  <button 
                    onClick={() => { setEditingTransaction(null); setQuickAddData(null); setActiveTab('add'); }}
                    className="w-[64px] h-[64px] bg-blue-600 text-white rounded-full flex items-center justify-center shadow-xl shadow-blue-500/40 transform transition active:scale-95 hover:bg-blue-700"
                  >
                    <i className="ph-fill ph-plus-circle text-[32px]"></i>
                  </button>
                </div>

                <NavItem iconClass="ph ph-chart-pie" label="集計" isActive={activeTab === 'stats'} onClick={() => setActiveTab('stats')} />
                <NavItem iconClass="ph ph-gear" label="設定" isActive={activeTab === 'settings'} onClick={() => setActiveTab('settings')} />
              </div>
            </nav>
          </div>
        </div>
      );
    }

    // --- Sub Components ---

    const NavItem = ({ iconClass, label, isActive, onClick }) => (
      <button 
        onClick={onClick} 
        className={`flex flex-col items-center justify-center w-full h-full transition-colors active:bg-slate-100/50 dark:active:bg-slate-800/50 rounded-xl ${isActive ? 'text-blue-600 dark:text-blue-400' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}
      >
        <div className={`mb-1 transition-transform text-[24px] ${isActive ? 'scale-110 font-bold' : 'scale-100'}`}>
          <i className={iconClass}></i>
        </div>
        <span className="text-[10px] font-medium mt-0.5">{label}</span>
      </button>
    );

    const HomeScreen = ({ total, transactions, settings, categories, onQuickAdd, onEdit, currentMonthKey, allTransactions }) => {
      const nextTarget = Math.floor(total / settings.notificationUnit) * settings.notificationUnit + settings.notificationUnit;
      const progressToNext = total % settings.notificationUnit;
      const progressPercent = Math.min(100, (progressToNext / settings.notificationUnit) * 100);
      const reachedUnit = Math.floor(total / settings.notificationUnit) * settings.notificationUnit;

      const budgetPercent = Math.min(100, (total / settings.budget) * 100);
      const remainingBudget = settings.budget - total;
      
      const prevMonthDate = new Date();
      prevMonthDate.setMonth(prevMonthDate.getMonth() - 1);
      const prevMonthKey = getMonthKey(prevMonthDate.toISOString());
      const prevMonthTotal = allTransactions
        .filter(t => getMonthKey(t.date) === prevMonthKey)
        .reduce((sum, t) => sum + Number(t.amount), 0);
      
      const diffFromPrev = total - prevMonthTotal;
      const isHigherThanPrev = diffFromPrev > 0;

      const today = new Date().getDate();
      const dailyAverage = today > 0 ? Math.round(total / today) : 0;

      return (
        <div className="p-4 space-y-6">
          <div className="text-center pt-4">
            <h2 className="text-slate-500 dark:text-slate-400 font-medium">{formatMonth(currentMonthKey)}</h2>
            <p className="text-sm text-slate-400 mb-1">今月の利用額</p>
            <div className="text-5xl font-bold tracking-tight text-slate-800 dark:text-white">
              <span className="text-2xl mr-1 text-slate-400 font-normal">¥</span>
              {formatCurrency(total)}
            </div>
            
            <div className="flex justify-center items-center space-x-4 mt-4 text-sm">
              <div className="bg-white dark:bg-slate-800 px-3 py-1.5 rounded-full shadow-sm border border-slate-100 dark:border-slate-700">
                 <span className="text-slate-500 dark:text-slate-400 mr-2">件数</span>
                 <span className="font-semibold">{transactions.length}件</span>
              </div>
              <div className="bg-white dark:bg-slate-800 px-3 py-1.5 rounded-full shadow-sm border border-slate-100 dark:border-slate-700">
                 <span className="text-slate-500 dark:text-slate-400 mr-2">1日平均</span>
                 <span className="font-semibold">¥{formatCurrency(dailyAverage)}</span>
              </div>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 relative overflow-hidden">
            <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
            <div className="flex justify-between items-end mb-3">
              <div>
                <p className="text-xs text-blue-600 dark:text-blue-400 font-bold mb-1">
                  {reachedUnit > 0 ? `${formatCurrency(reachedUnit)}円突破済` : '記録スタート'}
                </p>
                <p className="font-bold text-slate-800 dark:text-white">
                  次の{formatCurrency(settings.notificationUnit / 10000)}万円まで
                </p>
              </div>
              <div className="text-right">
                 <span className="text-sm text-slate-500">あと</span>
                 <p className="text-2xl font-bold text-slate-800 dark:text-white">¥{formatCurrency(nextTarget - total)}</p>
              </div>
            </div>
            
            <div className="relative h-3 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden mb-1">
              <div 
                className="absolute top-0 left-0 h-full bg-blue-500 rounded-full transition-all duration-700 ease-out"
                style={{ width: `${progressPercent}%` }}
              />
            </div>
            <div className="flex justify-between text-[10px] text-slate-400 px-1">
              <span>{formatCurrency(reachedUnit)}</span>
              <span>{formatCurrency(nextTarget)}</span>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
            <div className="flex justify-between mb-2 text-sm">
              <span className="text-slate-500">月間予算 {formatCurrency(settings.budget)}円</span>
              <span className={`font-semibold ${budgetPercent > 90 ? 'text-red-500' : 'text-slate-700 dark:text-slate-300'}`}>
                 {remainingBudget >= 0 ? `残り ¥${formatCurrency(remainingBudget)}` : `超過 ¥${formatCurrency(Math.abs(remainingBudget))}`}
              </span>
            </div>
            <div className="h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
              <div 
                className={`h-full rounded-full ${budgetPercent > 100 ? 'bg-red-500' : budgetPercent > 80 ? 'bg-orange-400' : 'bg-emerald-500'}`}
                style={{ width: `${Math.min(100, budgetPercent)}%` }}
              />
            </div>
            
            <div className="mt-4 p-3 bg-slate-50 dark:bg-slate-900/50 rounded-xl text-xs text-slate-600 dark:text-slate-400 leading-relaxed border border-slate-100 dark:border-slate-700">
              {budgetPercent >= 100 ? (
                <span className="text-red-500 font-medium flex items-center"><i className="ph-fill ph-warning-circle text-base mr-1 inline"></i>予算をオーバーしています。利用を控えましょう。</span>
              ) : budgetPercent >= 80 ? (
                <span className="text-orange-500 font-medium">予算の8割を消費しました。ペースに注意してください。</span>
              ) : (
                <span>予算に対して順調なペースです。</span>
              )}
              <div className="mt-1">
                先月比：{isHigherThanPrev ? `+${formatCurrency(diffFromPrev)}円ペース` : `${formatCurrency(Math.abs(diffFromPrev))}円節約中`}
              </div>
            </div>
          </div>

          <div>
            <h3 className="text-sm font-bold text-slate-700 dark:text-slate-300 mb-3 px-1">クイック登録</h3>
            <div className="grid grid-cols-4 gap-2">
              <button
                onClick={() => onQuickAdd(categories[0]?.id || null, '', true)}
                className="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-dashed border-slate-300 dark:border-slate-600 flex flex-col items-center justify-center space-y-1 active:bg-slate-50 dark:active:bg-slate-700 transition"
              >
                <div className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 dark:text-slate-500 bg-slate-50 dark:bg-slate-800">
                  <i className="ph ph-plus text-base"></i>
                </div>
                <span className="text-[10px] font-medium text-slate-500 dark:text-slate-400 truncate w-full text-center">フリー入力</span>
              </button>

              {categories.slice(0, 3).map(cat => (
                 <button
                   key={cat.id}
                   onClick={() => onQuickAdd(cat.id)}
                   className="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col items-center justify-center space-y-1 active:bg-slate-50 dark:active:bg-slate-700 transition"
                 >
                   <div className="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold" style={{ backgroundColor: cat.color }}>
                      {cat.name.substring(0, 1)}
                   </div>
                   <span className="text-[10px] font-medium text-slate-600 dark:text-slate-400 truncate w-full text-center">{cat.name}</span>
                 </button>
              ))}
            </div>
          </div>

          <div>
            <div className="flex justify-between items-center mb-3 px-1">
              <h3 className="text-sm font-bold text-slate-700 dark:text-slate-300">最近の利用</h3>
              <span className="text-xs text-slate-400">最新3件</span>
            </div>
            <div className="space-y-2">
              {transactions.slice(0, 3).map(t => {
                const cat = categories.find(c => c.id === t.categoryId) || categories[0];
                return (
                  <div 
                    key={t.id} 
                    onClick={() => onEdit(t)}
                    className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-between active:scale-[0.98] transition cursor-pointer"
                  >
                    <div className="flex items-center space-x-3">
                      <div className="w-10 h-10 rounded-full flex items-center justify-center text-white shadow-sm" style={{ backgroundColor: cat.color }}>
                        <i className="ph ph-credit-card text-[18px]"></i>
                      </div>
                      <div>
                        <p className="font-bold text-sm text-slate-800 dark:text-slate-200">{t.store || cat.name}</p>
                        <p className="text-xs text-slate-400">{t.date.split('-')[1]}/{t.date.split('-')[2]} • {cat.name}</p>
                      </div>
                    </div>
                    <div className="font-bold text-lg text-slate-800 dark:text-white">
                      ¥{formatCurrency(t.amount)}
                    </div>
                  </div>
                );
              })}
              {transactions.length === 0 && (
                <div className="text-center py-8 text-slate-400 text-sm bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700">
                  まだ今月の利用記録がありません。<br/>下部の「＋」から追加してください。
                </div>
              )}
            </div>
          </div>
          <div className="h-4"></div>
        </div>
      );
    };

    const ListScreen = ({ transactions, categories, cards, onEdit }) => {
      const [filterCategory, setFilterCategory] = useState('');
      const [filterMonth, setFilterMonth] = useState(getMonthKey(todayString()));
      const [filterAmount, setFilterAmount] = useState(0);

      const availableMonths = useMemo(() => {
        const months = new Set(transactions.map(t => getMonthKey(t.date)));
        months.add(getMonthKey(todayString()));
        return Array.from(months).sort().reverse();
      }, [transactions]);

      const filtered = useMemo(() => {
        return transactions.filter(t => {
          const matchMonth = filterMonth ? getMonthKey(t.date) === filterMonth : true;
          const matchCategory = filterCategory ? t.categoryId === filterCategory : true;
          const matchAmount = Number(t.amount) >= filterAmount;
          return matchMonth && matchCategory && matchAmount;
        });
      }, [transactions, filterMonth, filterCategory, filterAmount]);

      const filteredTotal = useMemo(() => {
        return filtered.reduce((sum, t) => sum + Number(t.amount), 0);
      }, [filtered]);

      const grouped = useMemo(() => {
        const groups = {};
        filtered.forEach(t => {
          if (!groups[t.date]) groups[t.date] = [];
          groups[t.date].push(t);
        });
        return Object.entries(groups).sort((a, b) => new Date(b[0]) - new Date(a[0]));
      }, [filtered]);

      return (
        <div className="flex flex-col h-screen">
          <div className="bg-white dark:bg-slate-900 z-10 sticky top-0 px-4 pt-6 pb-3 border-b border-slate-100 dark:border-slate-800">
            <h2 className="text-lg font-bold text-slate-800 dark:text-white mb-3">利用明細・検索</h2>
            
            <div className="space-y-3">
              <div className="relative">
                <select 
                  value={filterCategory}
                  onChange={e => setFilterCategory(e.target.value)}
                  className="w-full bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl px-4 py-2.5 text-sm font-medium focus:outline-none appearance-none"
                >
                  <option value="">すべてのカテゴリ</option>
                  {categories.map(c => (
                    <option key={c.id} value={c.id}>{c.name}</option>
                  ))}
                </select>
                <div className="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none text-slate-400">
                   <i className="ph ph-caret-down text-base"></i>
                </div>
              </div>

              <div className="flex space-x-2">
                <div className="flex-1 relative">
                  <select 
                    value={filterMonth} 
                    onChange={e => setFilterMonth(e.target.value)}
                    className="w-full bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl pl-3 pr-8 py-2 text-sm focus:outline-none appearance-none"
                  >
                    <option value="">すべての月</option>
                    {availableMonths.map(m => (
                      <option key={m} value={m}>{formatMonth(m)}</option>
                    ))}
                  </select>
                  <div className="absolute right-2 top-1/2 transform -translate-y-1/2 pointer-events-none text-slate-400">
                     <i className="ph ph-caret-down text-sm"></i>
                  </div>
                </div>

                <div className="flex-1 relative">
                  <select 
                    value={filterAmount} 
                    onChange={e => setFilterAmount(Number(e.target.value))}
                    className="w-full bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl pl-3 pr-8 py-2 text-sm focus:outline-none appearance-none"
                  >
                    <option value="0">金額指定なし</option>
                    <option value="5000">¥5,000以上</option>
                    <option value="10000">¥10,000以上</option>
                    <option value="30000">¥30,000以上</option>
                  </select>
                  <div className="absolute right-2 top-1/2 transform -translate-y-1/2 pointer-events-none text-slate-400">
                     <i className="ph ph-caret-down text-sm"></i>
                  </div>
                </div>
              </div>
            </div>

            <div className="mt-4 flex justify-between items-end">
               <span className="text-xs font-bold text-slate-500 dark:text-slate-400">{filtered.length}件の明細</span>
               <div className="text-right">
                 <span className="text-[10px] text-slate-400 mr-1">合計</span>
                 <span className="text-lg font-bold text-blue-600 dark:text-blue-400">¥{formatCurrency(filteredTotal)}</span>
               </div>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-4 space-y-6 pb-32">
            {grouped.length === 0 ? (
              <div className="text-center py-10 text-slate-400 text-sm">
                該当する明細がありません
              </div>
            ) : (
              grouped.map(([date, items]) => (
                <div key={date}>
                  <div className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 pl-1 flex items-center">
                    <div className="w-2 h-2 rounded-full bg-blue-500 mr-2"></div>
                    {date.split('-')[1]}月{date.split('-')[2]}日
                  </div>
                  <div className="space-y-2">
                    {items.map(t => {
                      const cat = categories.find(c => c.id === t.categoryId) || categories[0];
                      const card = cards.find(c => c.id === t.cardId) || cards[0];
                      return (
                        <div 
                          key={t.id} 
                          onClick={() => onEdit(t)}
                          className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 active:scale-[0.98] transition cursor-pointer flex items-center justify-between"
                        >
                          <div className="flex items-center space-x-3 overflow-hidden">
                            <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white shrink-0" style={{ backgroundColor: cat.color }}>
                              {cat.name.substring(0, 1)}
                            </div>
                            <div className="truncate">
                              <p className="font-bold text-sm text-slate-800 dark:text-slate-200 truncate">{t.store || cat.name}</p>
                              <div className="flex items-center text-[10px] text-slate-400 mt-0.5 space-x-2">
                                <span>{cat.name}</span>
                                {cards.length > 1 && (
                                  <>
                                    <span className="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-600"></span>
                                    <span className="truncate">{card.name}</span>
                                  </>
                                )}
                              </div>
                            </div>
                          </div>
                          <div className="font-bold text-lg text-slate-800 dark:text-white pl-2 shrink-0">
                            ¥{formatCurrency(t.amount)}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    };

    const AddScreen = ({ onSave, onCancel, categories, cards, initialData, onDelete, onAddCategory }) => {
      const [amount, setAmount] = useState(initialData?.amount?.toString() || '');
      const [date, setDate] = useState(initialData?.date || todayString());
      const [store, setStore] = useState(initialData?.store || '');
      const [categoryId, setCategoryId] = useState(initialData?.categoryId || categories[0]?.id);
      const [cardId, setCardId] = useState(initialData?.cardId || cards[0]?.id);
      const [memo, setMemo] = useState(initialData?.memo || '');

      const [isAddingCategory, setIsAddingCategory] = useState(initialData?.startWithFreeWord || false);
      const [newCategoryName, setNewCategoryName] = useState('');

      const amountInputRef = useRef(null);
      const newCatInputRef = useRef(null);

      useEffect(() => {
        setIsAddingCategory(initialData?.startWithFreeWord || false);
      }, [initialData]);

      useEffect(() => {
        if (!initialData?.amount && amountInputRef.current && !isAddingCategory) {
          setTimeout(() => amountInputRef.current.focus(), 100);
        }
      }, [initialData, isAddingCategory]);

      useEffect(() => {
        if (isAddingCategory && newCatInputRef.current) {
          newCatInputRef.current.focus();
        }
      }, [isAddingCategory]);

      const handleSave = () => {
        if (!amount || Number(amount) <= 0) {
          alert('有効な金額を入力してください');
          return;
        }
        onSave({
          amount: Number(amount),
          date,
          store,
          categoryId,
          cardId,
          memo
        });
      };

      const handleSaveCustomCategory = (e) => {
        e.preventDefault();
        if (newCategoryName.trim()) {
          const colors = ['#f43f5e', '#8b5cf6', '#10b981', '#f59e0b', '#06b6d4', '#ec4899', '#3b82f6', '#14b8a6'];
          const randomColor = colors[Math.floor(Math.random() * colors.length)];
          const newCat = {
            id: 'c' + Date.now(),
            name: newCategoryName.trim(),
            color: randomColor
          };
          onAddCategory(newCat);
          setCategoryId(newCat.id);
          setNewCategoryName('');
          setIsAddingCategory(false);
        } else {
          setIsAddingCategory(false);
        }
      };

      return (
        <div className="bg-slate-50 dark:bg-slate-900 min-h-screen flex flex-col z-50 absolute inset-0">
          <div className="flex justify-between items-center px-4 py-4 bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 sticky top-0 z-10">
            <button onClick={onCancel} className="text-slate-400 p-2"><i className="ph ph-x text-2xl"></i></button>
            <h2 className="font-bold text-slate-800 dark:text-white">{initialData?.id ? '記録の編集' : '利用の記録'}</h2>
            {onDelete ? (
              <button onClick={onDelete} className="text-red-500 p-2"><i className="ph ph-trash text-xl"></i></button>
            ) : <div className="w-10"></div>}
          </div>

          <div className="flex-1 overflow-y-auto pb-32">
            <div className="bg-blue-600 px-6 py-10 text-white rounded-b-3xl shadow-md">
              <p className="text-blue-200 text-sm font-medium mb-2 text-center">金額を入力</p>
              <div className="flex justify-center items-center">
                <span className="text-4xl font-light mr-2 opacity-80">¥</span>
                <input 
                  ref={amountInputRef}
                  type="number" 
                  inputMode="numeric"
                  pattern="[0-9]*"
                  value={amount}
                  onChange={e => setAmount(e.target.value)}
                  placeholder="0"
                  className="bg-transparent text-5xl font-bold w-full max-w-[200px] outline-none placeholder-blue-400 text-center caret-white"
                />
              </div>
            </div>

            <div className="p-5 space-y-5 -mt-4">
              <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-3">カテゴリ</label>
                <div className="flex overflow-x-auto pb-2 space-x-2 hide-scrollbar items-center">
                  {categories.map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => setCategoryId(cat.id)}
                      className={`flex flex-col items-center justify-center shrink-0 w-16 h-16 rounded-2xl transition-all ${categoryId === cat.id ? 'ring-2 ring-blue-500 bg-blue-50 dark:bg-blue-900/30' : 'bg-slate-50 dark:bg-slate-700/50 grayscale hover:grayscale-0'}`}
                    >
                      <div className="w-6 h-6 rounded-full mb-1 flex items-center justify-center" style={{ backgroundColor: cat.color }}></div>
                      <span className={`text-[10px] font-bold ${categoryId === cat.id ? 'text-blue-700 dark:text-blue-300' : 'text-slate-500 dark:text-slate-400'}`}>{cat.name}</span>
                    </button>
                  ))}

                  {isAddingCategory ? (
                    <form 
                      onSubmit={handleSaveCustomCategory}
                      className="flex flex-col items-center justify-center shrink-0 w-24 h-16 rounded-2xl bg-blue-50 dark:bg-blue-900/30 ring-2 ring-blue-500 p-1"
                    >
                      <input 
                        ref={newCatInputRef}
                        type="text"
                        value={newCategoryName}
                        onChange={e => setNewCategoryName(e.target.value)}
                        className="w-full text-xs bg-transparent text-center focus:outline-none dark:text-white font-bold"
                        placeholder="カテゴリ名"
                        onBlur={(e) => {
                          if (!e.target.value.trim()) setIsAddingCategory(false);
                        }}
                      />
                      <div className="flex mt-1 space-x-2 w-full justify-center">
                        <button type="submit" className="text-[10px] text-blue-600 dark:text-blue-400 font-bold px-2 py-1 bg-blue-100 dark:bg-blue-800 rounded">決定</button>
                      </div>
                    </form>
                  ) : (
                    <button
                      onClick={() => setIsAddingCategory(true)}
                      className="flex flex-col items-center justify-center shrink-0 w-16 h-16 rounded-2xl transition-all bg-slate-50 dark:bg-slate-800 border border-dashed border-slate-300 dark:border-slate-600 active:bg-slate-200 dark:active:bg-slate-700"
                    >
                      <div className="w-6 h-6 rounded-full mb-1 flex items-center justify-center text-slate-400 dark:text-slate-500">
                        <i className="ph ph-plus text-base"></i>
                      </div>
                      <span className="text-[10px] font-bold text-slate-500 dark:text-slate-400">追加</span>
                    </button>
                  )}
                </div>
              </div>

              <div className="space-y-4">
                <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden divide-y divide-slate-100 dark:divide-slate-700">
                  
                  <div className="flex items-center p-4">
                    <label className="w-20 text-sm font-bold text-slate-500 dark:text-slate-400">店名</label>
                    <input 
                      type="text" 
                      value={store}
                      onChange={e => setStore(e.target.value)}
                      placeholder="未入力の場合はカテゴリ名"
                      className="flex-1 bg-transparent text-sm font-medium text-slate-800 dark:text-white focus:outline-none placeholder-slate-300"
                    />
                  </div>

                  <div className="flex items-center p-4">
                    <label className="w-20 text-sm font-bold text-slate-500 dark:text-slate-400">日付</label>
                    <input 
                      type="date" 
                      value={date}
                      onChange={e => setDate(e.target.value)}
                      className="flex-1 bg-transparent text-sm font-medium text-slate-800 dark:text-white focus:outline-none appearance-none"
                    />
                  </div>

                  {cards.length > 1 && (
                    <div className="flex items-center p-4">
                      <label className="w-20 text-sm font-bold text-slate-500 dark:text-slate-400">カード</label>
                      <select 
                        value={cardId}
                        onChange={e => setCardId(e.target.value)}
                        className="flex-1 bg-transparent text-sm font-medium text-slate-800 dark:text-white focus:outline-none appearance-none"
                      >
                        {cards.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>
                  )}

                   <div className="flex items-start p-4">
                    <label className="w-20 text-sm font-bold text-slate-500 dark:text-slate-400 pt-1">メモ</label>
                    <textarea 
                      value={memo}
                      onChange={e => setMemo(e.target.value)}
                      placeholder="任意"
                      rows="2"
                      className="flex-1 bg-transparent text-sm font-medium text-slate-800 dark:text-white focus:outline-none resize-none placeholder-slate-300"
                    />
                  </div>

                </div>
              </div>
            </div>
          </div>

          <div className="absolute bottom-0 left-0 w-full p-4 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 pb-safe">
            <button 
              onClick={handleSave}
              className="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/30 active:scale-95 transition-transform flex items-center justify-center space-x-2"
            >
              <i className="ph-fill ph-check-circle text-xl"></i>
              <span>保存する</span>
            </button>
          </div>
        </div>
      );
    };

    const StatsScreen = ({ transactions, categories, cards }) => {
      const [viewType, setViewType] = useState('category'); 
      const [startDate, setStartDate] = useState(getFirstDayOfMonth());
      const [endDate, setEndDate] = useState(getLastDayOfMonth());
      const [targetYear, setTargetYear] = useState(() => new Date().getFullYear().toString());

      const periodData = useMemo(() => {
        return transactions.filter(t => {
          const d = t.date;
          return (!startDate || d >= startDate) && (!endDate || d <= endDate);
        });
      }, [transactions, startDate, endDate]);

      const periodTotal = periodData.reduce((sum, t) => sum + Number(t.amount), 0);

      const categoryStats = useMemo(() => {
        const stats = {};
        periodData.forEach(t => {
          if (!stats[t.categoryId]) stats[t.categoryId] = 0;
          stats[t.categoryId] += Number(t.amount);
        });
        return Object.entries(stats)
          .map(([id, amount]) => ({
            ...categories.find(c => c.id === id) || categories[0],
            amount,
            percent: periodTotal > 0 ? (amount / periodTotal) * 100 : 0
          }))
          .sort((a, b) => b.amount - a.amount);
      }, [periodData, categories, periodTotal]);

      const cardStats = useMemo(() => {
        const stats = {};
        periodData.forEach(t => {
          if (!stats[t.cardId]) stats[t.cardId] = { count: 0, amount: 0 };
          stats[t.cardId].amount += Number(t.amount);
          stats[t.cardId].count += 1;
        });
        return Object.entries(stats)
          .map(([id, data]) => ({
            ...cards.find(c => c.id === id) || cards[0],
            ...data,
            percent: periodTotal > 0 ? (data.amount / periodTotal) * 100 : 0
          }))
          .sort((a, b) => b.amount - a.amount);
      }, [periodData, cards, periodTotal]);

      const yearlyData = useMemo(() => {
        const yearTx = transactions.filter(t => t.date.startsWith(targetYear));
        const monthlyTotals = Array.from({length: 12}, () => 0);
        yearTx.forEach(t => {
          const m = parseInt(t.date.split('-')[1]) - 1;
          monthlyTotals[m] += Number(t.amount);
        });
        const max = Math.max(...monthlyTotals, 1);
        return monthlyTotals.map((amount, i) => ({
          month: i + 1,
          amount,
          heightPercent: (amount / max) * 100
        }));
      }, [transactions, targetYear]);

      const yearlyTotal = yearlyData.reduce((sum, d) => sum + d.amount, 0);
      let cumulativePercent = 0;
      
      return (
        <div className="flex flex-col h-screen">
          <div className="px-4 py-6 bg-white dark:bg-slate-900 sticky top-0 z-10 border-b border-slate-100 dark:border-slate-800">
            <h2 className="text-lg font-bold text-slate-800 dark:text-white mb-4">利用集計</h2>
            
            <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl mb-4">
              <button 
                onClick={() => setViewType('category')}
                className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${viewType === 'category' ? 'bg-white dark:bg-slate-700 text-blue-600 shadow-sm' : 'text-slate-500'}`}
              >
                カテゴリ
              </button>
              
              {cards.length > 1 && (
                <button 
                  onClick={() => setViewType('card')}
                  className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${viewType === 'card' ? 'bg-white dark:bg-slate-700 text-blue-600 shadow-sm' : 'text-slate-500'}`}
                >
                  カード別
                </button>
              )}

              <button 
                onClick={() => setViewType('yearly')}
                className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${viewType === 'yearly' ? 'bg-white dark:bg-slate-700 text-blue-600 shadow-sm' : 'text-slate-500'}`}
              >
                年間推移
              </button>
            </div>

            {viewType !== 'yearly' && (
              <div className="animate-fade-in">
                <div className="flex items-center justify-between bg-slate-50 dark:bg-slate-800 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700">
                   <div className="flex-1 relative flex items-center">
                     <i className="ph ph-calendar text-base absolute left-2 text-slate-400 pointer-events-none"></i>
                     <input 
                       type="date" 
                       value={startDate} 
                       onChange={e => setStartDate(e.target.value)} 
                       className="w-full bg-transparent text-xs font-bold text-slate-700 dark:text-slate-200 outline-none pl-7 pr-1 appearance-none"
                     />
                   </div>
                   <span className="text-slate-400 font-bold px-1 text-xs">〜</span>
                   <div className="flex-1 relative flex items-center">
                     <i className="ph ph-calendar text-base absolute left-2 text-slate-400 pointer-events-none"></i>
                     <input 
                       type="date" 
                       value={endDate} 
                       onChange={e => setEndDate(e.target.value)} 
                       className="w-full bg-transparent text-xs font-bold text-slate-700 dark:text-slate-200 outline-none pl-7 pr-1 appearance-none"
                     />
                   </div>
                </div>
                <div className="text-center mt-3">
                   <div className="text-xs text-slate-500 font-medium">指定期間の合計</div>
                   <div className="text-2xl font-bold text-slate-800 dark:text-white mt-1">¥{formatCurrency(periodTotal)}</div>
                </div>
              </div>
            )}
            
            {viewType === 'yearly' && (
              <div className="animate-fade-in">
                <div className="flex items-center justify-between bg-slate-50 dark:bg-slate-800 p-1.5 rounded-xl border border-slate-100 dark:border-slate-700 mb-3">
                   <button 
                      className="p-2 text-slate-400 hover:text-blue-500 transition"
                      onClick={() => setTargetYear((parseInt(targetYear) - 1).toString())}
                   ><i className="ph ph-caret-left text-xl"></i></button>
                   <div className="font-bold text-slate-800 dark:text-white">{targetYear}年</div>
                   <button 
                      className="p-2 text-slate-400 hover:text-blue-500 transition"
                      onClick={() => setTargetYear((parseInt(targetYear) + 1).toString())}
                   ><i className="ph ph-caret-right text-xl"></i></button>
                </div>
                <div className="text-center mt-3">
                  <div className="text-xs text-slate-500 font-medium">年間利用額</div>
                  <div className="text-2xl font-bold text-blue-600 dark:text-blue-400 mt-1">¥{formatCurrency(yearlyTotal)}</div>
                </div>
              </div>
            )}
          </div>

          <div className="flex-1 overflow-y-auto p-4 pb-32">
            
            {viewType === 'category' && (
              <>
                {periodTotal > 0 ? (
                  <div className="mb-6 flex justify-center">
                    <svg width="200" height="200" viewBox="0 0 42 42" className="transform -rotate-90 drop-shadow-md">
                      <circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#f1f5f9" className="dark:stroke-slate-700" strokeWidth="6"></circle>
                      {categoryStats.map(stat => {
                        const strokeDasharray = `${stat.percent} ${100 - stat.percent}`;
                        const strokeDashoffset = -cumulativePercent;
                        cumulativePercent += stat.percent;
                        return (
                          <circle 
                            key={stat.id}
                            cx="21" cy="21" r="15.91549430918954" 
                            fill="transparent" 
                            stroke={stat.color} 
                            strokeWidth="6"
                            strokeDasharray={strokeDasharray}
                            strokeDashoffset={strokeDashoffset}
                            className="transition-all duration-1000 ease-out"
                          ></circle>
                        )
                      })}
                      <text x="21" y="20" fill="currentColor" className="text-[5px] font-bold text-slate-800 dark:text-white text-center transform rotate-90" textAnchor="middle">¥{formatCurrency(periodTotal)}</text>
                      <text x="21" y="25" fill="currentColor" className="text-[3px] text-slate-400 text-center transform rotate-90" textAnchor="middle">TOTAL</text>
                    </svg>
                  </div>
                ) : (
                  <div className="h-40 flex items-center justify-center text-slate-400 text-sm">指定期間のデータがありません</div>
                )}

                <div className="space-y-3">
                  {categoryStats.map(stat => (
                    <div key={stat.id} className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-between">
                      <div className="flex items-center space-x-3">
                        <div className="w-3 h-10 rounded-full" style={{ backgroundColor: stat.color }}></div>
                        <div>
                          <div className="font-bold text-sm text-slate-800 dark:text-white">{stat.name}</div>
                          <div className="text-xs text-slate-400">{stat.percent.toFixed(1)}%</div>
                        </div>
                      </div>
                      <div className="font-bold text-slate-800 dark:text-white">¥{formatCurrency(stat.amount)}</div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {viewType === 'card' && cards.length > 1 && (
              <div className="space-y-4 mt-2">
                {cardStats.length > 0 ? cardStats.map(stat => (
                  <div key={stat.id} className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 relative overflow-hidden">
                    <div className="absolute -right-4 -bottom-4 opacity-5 text-slate-900 dark:text-white">
                      <i className="ph ph-credit-card text-[100px]"></i>
                    </div>
                    <div className="font-bold text-slate-800 dark:text-white mb-1 flex items-center">
                      <i className="ph ph-credit-card text-xl mr-2 text-slate-400"></i> {stat.name}
                    </div>
                    <div className="text-3xl font-bold text-slate-800 dark:text-white my-3">
                      ¥{formatCurrency(stat.amount)}
                    </div>
                    <div className="flex justify-between text-sm text-slate-500 border-t border-slate-100 dark:border-slate-700 pt-3">
                      <span>利用割合: {stat.percent.toFixed(1)}%</span>
                      <span>利用件数: {stat.count}件</span>
                    </div>
                  </div>
                )) : (
                  <div className="text-center py-10 text-slate-400 text-sm">指定期間のデータがありません</div>
                )}
              </div>
            )}

            {viewType === 'yearly' && (
              <div className="mt-4 bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                 <div className="h-48 flex items-end justify-between space-x-1 pb-2 border-b border-slate-100 dark:border-slate-700">
                    {yearlyData.map(d => (
                      <div key={d.month} className="flex flex-col items-center flex-1 group h-full pt-2">
                         <div className="w-full flex-1 flex items-end">
                           <div 
                             className="w-full bg-blue-500 rounded-t-sm transition-all duration-500 min-h-[4px]"
                             style={{ height: `${d.heightPercent}%` }}
                           ></div>
                         </div>
                         <span className="text-[10px] text-slate-400 mt-2 shrink-0">{d.month}月</span>
                      </div>
                    ))}
                 </div>
                 
                 <div className="mt-6 space-y-3">
                    <h3 className="text-xs font-bold text-slate-500 mb-2">月別詳細</h3>
                    {yearlyData.slice().reverse().map(d => d.amount > 0 && (
                      <div key={d.month} className="flex justify-between items-center py-2 border-b border-slate-50 dark:border-slate-700/50 last:border-0">
                        <span className="text-sm font-medium text-slate-600 dark:text-slate-300">{d.month}月</span>
                        <span className="font-bold text-slate-800 dark:text-white">¥{formatCurrency(d.amount)}</span>
                      </div>
                    ))}
                 </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    const SettingsScreen = ({ 
      settings, setSettings, notificationHistory, 
      transactions, setTransactions, categories, setCategories, cards, setCards, onShowToast 
    }) => {
      const fileInputRef = useRef(null);
      
      const handleExport = () => {
        const escapeCsv = (str) => {
          if (str === null || str === undefined) return '';
          const stringified = String(str);
          if (stringified.includes(',') || stringified.includes('"') || stringified.includes('\n')) {
            return `"${stringified.replace(/"/g, '""')}"`;
          }
          return stringified;
        };

        const headers = ['ID', '日付', '金額', '店名', 'カテゴリ', 'カード', 'メモ'];
        
        const rows = transactions.map(t => {
          const categoryName = categories.find(c => c.id === t.categoryId)?.name || '不明なカテゴリ';
          const cardName = cards.find(c => c.id === t.cardId)?.name || '不明なカード';
          
          return [
            escapeCsv(t.id),
            escapeCsv(t.date),
            escapeCsv(t.amount),
            escapeCsv(t.store),
            escapeCsv(categoryName),
            escapeCsv(cardName),
            escapeCsv(t.memo)
          ];
        });

        const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
        
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', `利用記録バックアップ_${todayString()}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const parseCSV = (text) => {
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length <= 1) return []; 
        
        const results = [];
        for (let i = 1; i < lines.length; i++) {
          const rowStr = lines[i];
          const row = [];
          let inQuotes = false;
          let currentVal = "";
          for (let j = 0; j < rowStr.length; j++) {
            const char = rowStr[j];
            if (char === '"') {
              if (inQuotes && rowStr[j+1] === '"') {
                currentVal += '"';
                j++;
              } else {
                inQuotes = !inQuotes;
              }
            } else if (char === ',' && !inQuotes) {
              row.push(currentVal);
              currentVal = "";
            } else {
              currentVal += char;
            }
          }
          row.push(currentVal);
          results.push(row);
        }
        return results;
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const text = event.target.result;
            const cleanText = text.replace(/^\uFEFF/, '');
            const parsedRows = parseCSV(cleanText);
            
            if (parsedRows.length === 0) {
              alert('読み込めるデータがありませんでした。');
              return;
            }

            let newCategories = [...categories];
            let newCards = [...cards];
            let newTransactions = [...transactions];
            let importCount = 0;
            let updateCount = 0;

            parsedRows.forEach(row => {
              if (row.length < 7) return;
              const [id, date, amountStr, store, categoryName, cardName, memo] = row;
              
              const amount = Number(amountStr);
              if (isNaN(amount) || amount <= 0) return;

              let cat = newCategories.find(c => c.name === categoryName);
              if (!cat) {
                const colors = ['#f43f5e', '#8b5cf6', '#10b981', '#f59e0b', '#06b6d4', '#ec4899', '#3b82f6', '#14b8a6'];
                cat = { id: 'c_imp_' + Date.now() + Math.random().toString(36).substring(7), name: categoryName, color: colors[Math.floor(Math.random() * colors.length)] };
                newCategories.push(cat);
              }
              
              let card = newCards.find(c => c.name === cardName);
              if (!card) {
                card = { id: 'card_imp_' + Date.now() + Math.random().toString(36).substring(7), name: cardName };
                newCards.push(card);
              }

              const newTx = {
                id: id || generateId(),
                date,
                amount,
                store,
                categoryId: cat.id,
                cardId: card.id,
                memo
              };

              const existingIndex = newTransactions.findIndex(t => t.id === newTx.id);
              if (existingIndex >= 0) {
                newTransactions[existingIndex] = newTx;
                updateCount++;
              } else {
                newTransactions.push(newTx);
                importCount++;
              }
            });
            
            setCategories(newCategories);
            setCards(newCards);
            newTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            setTransactions(newTransactions);
            
            alert(`${importCount}件追加、${updateCount}件更新しました。`);
            if (onShowToast) onShowToast('データを読み込みました');
            
          } catch(err) {
            alert("ファイルの読み込みに失敗しました。形式が正しいか確認してください。");
            console.error(err);
          }
          e.target.value = null; 
        };
        reader.readAsText(file);
      };

      const clearAllData = () => {
        if(window.confirm('すべての記録が削除されます。本当によろしいですか？（元に戻せません）')){
          setTransactions([]);
          alert('すべてのデータを削除しました。');
        }
      }

      return (
        <div className="p-4 pb-32 space-y-6">
          <h2 className="text-lg font-bold text-slate-800 dark:text-white pt-2 ml-1">設定</h2>

          <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
            <div className="p-4 bg-slate-50 dark:bg-slate-900 border-b border-slate-100 dark:border-slate-700">
              <h3 className="font-bold text-sm text-slate-700 dark:text-slate-300">予算・目標設定</h3>
            </div>
            <div className="p-4 space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-500 mb-1">月間予算 (円)</label>
                <input 
                  type="number"
                  value={settings.budget}
                  onChange={e => setSettings({...settings, budget: Number(e.target.value)})}
                  className="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white rounded-xl px-4 py-3 font-bold focus:outline-none"
                />
              </div>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
            <div className="p-4 bg-slate-50 dark:bg-slate-900 border-b border-slate-100 dark:border-slate-700">
              <h3 className="font-bold text-sm text-slate-700 dark:text-slate-300">通知機能 (使いすぎ防止)</h3>
            </div>
            <div className="p-4 space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <div className="font-bold text-sm text-slate-800 dark:text-white">通知を有効にする</div>
                  <div className="text-xs text-slate-500 mt-0.5">一定額を超えるごとにお知らせします</div>
                </div>
                <label className="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" className="sr-only peer" checked={settings.enableNotification} onChange={e => setSettings({...settings, enableNotification: e.target.checked})} />
                  <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-blue-600"></div>
                </label>
              </div>
              
              <div className={`transition-opacity ${settings.enableNotification ? 'opacity-100' : 'opacity-50 pointer-events-none'}`}>
                <label className="block text-xs font-bold text-slate-500 mb-2">通知する金額の単位</label>
                <select 
                  value={settings.notificationUnit}
                  onChange={e => setSettings({...settings, notificationUnit: Number(e.target.value)})}
                  className="w-full bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white rounded-xl px-4 py-3 font-bold focus:outline-none appearance-none"
                >
                  <option value="1000">1,000円ごと</option>
                  <option value="5000">5,000円ごと</option>
                  <option value="10000">10,000円ごと</option>
                  <option value="20000">20,000円ごと</option>
                  <option value="50000">50,000円ごと</option>
                </select>
              </div>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
            <div className="p-4 bg-slate-50 dark:bg-slate-900 border-b border-slate-100 dark:border-slate-700">
              <h3 className="font-bold text-sm text-slate-700 dark:text-slate-300">アプリ設定</h3>
            </div>
            <div className="p-4 space-y-4">
              <div className="flex items-center justify-between">
                <div className="font-bold text-sm text-slate-800 dark:text-white">ダークモード</div>
                <label className="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" className="sr-only peer" checked={settings.darkMode} onChange={e => setSettings({...settings, darkMode: e.target.checked})} />
                  <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-blue-600"></div>
                </label>
              </div>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
            <div className="p-4 bg-slate-50 dark:bg-slate-900 border-b border-slate-100 dark:border-slate-700">
              <h3 className="font-bold text-sm text-slate-700 dark:text-slate-300">通知履歴</h3>
            </div>
            <div className="p-4 max-h-40 overflow-y-auto space-y-2 text-sm">
              {notificationHistory.length === 0 ? (
                <p className="text-slate-400 text-center text-xs py-2">履歴はありません</p>
              ) : (
                notificationHistory.map(h => (
                  <div key={h.id} className="border-b border-slate-100 dark:border-slate-700 pb-2 last:border-0 last:pb-0">
                    <p className="text-[10px] text-slate-400">{new Date(h.date).toLocaleString('ja-JP')}</p>
                    <p className="text-slate-800 dark:text-slate-200">{h.message}</p>
                  </div>
                ))
              )}
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
            <div className="p-4 bg-slate-50 dark:bg-slate-900 border-b border-slate-100 dark:border-slate-700">
              <h3 className="font-bold text-sm text-slate-700 dark:text-slate-300">データ管理</h3>
            </div>
            <div className="p-4 space-y-3">
              <button 
                onClick={handleExport}
                className="w-full flex items-center justify-center space-x-2 py-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl transition font-medium text-sm text-slate-700 dark:text-slate-200"
              >
                <i className="ph ph-download-simple text-base"></i>
                <span>CSVでバックアップ (保存)</span>
              </button>
              
              <button 
                onClick={() => fileInputRef.current?.click()}
                className="w-full flex items-center justify-center space-x-2 py-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl transition font-medium text-sm text-slate-700 dark:text-slate-200"
              >
                <i className="ph ph-upload-simple text-base"></i>
                <span>CSVから読み込む</span>
              </button>
              <input 
                type="file" 
                accept=".csv" 
                ref={fileInputRef} 
                className="hidden" 
                onChange={handleImport} 
              />
              
              <div className="pt-2 border-t border-slate-100 dark:border-slate-700/50 mt-4">
                <button 
                  onClick={clearAllData}
                  className="w-full py-3 text-red-500 font-medium text-sm rounded-xl hover:bg-red-50 dark:hover:bg-red-900/10 transition"
                >
                  すべてのデータをリセット
                </button>
              </div>
            </div>
          </div>
          
        </div>
      );
    };

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
